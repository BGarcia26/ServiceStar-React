# Nombre de la aplicación.
spring.application.name=servicestar-api

# Servidor: localhost. Puerto: 3306 (se puede cambiar con DB_PORT). Base de datos: servicestar.
# createDatabaseIfNotExist crea la base de datos si todavía no existe.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/servicestar?createDatabaseIfNotExist=true

# Usuario para conectarse a MySQL.
# Se leen de variables de entorno para no subir la contraseña a GitHub.
# Si no existen, se usa root sin contraseña (como en Laragon).
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Clase del controlador JDBC que permite conectarse con MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
# Valida que la estructura de las tablas coincida con las entidades.
# Hibernate no crea ni modifica tablas; esa tarea la realiza Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Muestra en la consola las sentencias SQL ejecutadas por Hibernate.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# La API estará disponible en http://localhost:8082.
server.port=8082

# Habilita la ejecución de las migraciones pendientes al iniciar.
spring.flyway.enabled=true
# Corresponde a src/main/resources/db/migracion dentro del proyecto.
spring.flyway.locations=classpath:db/migracion

# SEGURIDAD (JWT)
# Clave con la que se firman los tokens (mínimo 32 caracteres).
app.jwt.secreto=${JWT_SECRET:servicestar-clave-de-desarrollo-cambiar-en-produccion-2026}
# Minutos que dura la sesión antes de que el token expire.
app.jwt.expiracion-minutos=120

# Usuario administrador que se crea automáticamente al iniciar si no existe.
app.admin.nombre=Administrador Service Star
app.admin.correo=admin@servicestar.cl
app.admin.password=${ADMIN_PASSWORD:Admin123*}

# Origen del frontend (Vite) autorizado por CORS.
app.cors.origen=http://localhost:5173

# SWAGGER: documentación en http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
