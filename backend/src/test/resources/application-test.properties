# Perfil "test": reemplaza MySQL por H2 en memoria (modo compatible con MySQL)
# para ejecutar las pruebas sin depender de un servidor de base de datos.
spring.datasource.url=jdbc:h2:mem:servicestar;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway ejecuta las mismas migraciones. La validación de tipos se hace contra MySQL real.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
